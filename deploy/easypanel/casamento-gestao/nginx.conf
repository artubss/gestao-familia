server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location / {
        proxy_pass http://sorio_casamento-gestao-api:80;
        proxy_http_version 1.1;
        # Authenticated Laravel responses set several encrypted cookies. The default
        # 4k/8k proxy buffer turns that into "upstream sent too big header" (502).
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik terminates TLS; $scheme here is always http. Pass through the edge proto so Laravel builds https URLs.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
    }
}
